---
name: CI
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  schedule:
    # Run once a month
    - cron: '1 2 3 * *'

env:
  DOCKER_CONTAINER: frankjoshua/ros2-face

jobs:
  test:
    name: Python and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: PYTHONPATH=src/robot_face python -m pytest -q src/robot_face/test

  docker:
    name: Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image and publish outside pull requests
        run: |
          args=(-t "$DOCKER_CONTAINER" -a linux/arm64,linux/amd64)
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            args+=(-p)
          fi
          ./build.sh "${args[@]}"
