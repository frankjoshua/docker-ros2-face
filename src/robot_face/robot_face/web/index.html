<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>face</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body.ui { cursor: auto; }
  #stage, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #controls {
    position: fixed; left: 50%; bottom: 14px; z-index: 10; width: min(980px, calc(100vw - 24px));
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    display: grid; gap: 8px; padding: 10px; box-sizing: border-box; border-radius: 16px;
    background: rgba(12, 14, 22, .62); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 8px 30px rgba(0, 0, 0, .35);
    font: 13px/1.2 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif; color: #e9ecf5;
  }
  body.ui #controls { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #controls .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  #controls > .row:first-child { justify-content: space-between; gap: 6px 16px; }
  #controls button {
    font: inherit; color: inherit; min-height: 32px; padding: 0 9px; border-radius: 999px; cursor: pointer;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16);
  }
  #controls button:hover { background: rgba(255, 255, 255, .16); }
  #controls button[aria-pressed="true"] { background: #e9ecf5; color: #10131c; border-color: #e9ecf5; }
  #controls button.look, #controls button.expr { text-transform: capitalize; }
  #controls button.look { font-weight: 600; }
  #controls :focus-visible { outline: 2px solid #8fd8ff; outline-offset: 2px; }
  #controls .pad {
    position: relative; width: 120px; height: 40px; border-radius: 10px; touch-action: none; cursor: crosshair;
    border: 1px solid rgba(255, 255, 255, .16);
    background: linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)) center / 1px 100% no-repeat,
      linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)) center / 100% 1px no-repeat, rgba(255, 255, 255, .05);
  }
  #controls .pad i { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #ff8fb8; pointer-events: none; }
  #controls .pad .ax { position: absolute; left: 6px; top: 3px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; opacity: .6; pointer-events: none; }
  #controls .follow { display: inline-flex; gap: 6px; align-items: center; opacity: .85; }
  @media (prefers-reduced-motion: reduce) { #controls { transition: none; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<div id="stage"></div>
<script type="module" src="face/main.js"></script>
