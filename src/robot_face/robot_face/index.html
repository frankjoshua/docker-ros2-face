<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>face</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #diag-layer, #map-layer { cursor: default; }
  svg { width: 100vw; height: 100vh; display: block; }
  g { transform-box: fill-box; transform-origin: center; }
  .eye, .brow, .mouth { transition: transform .2s ease; }
  .lid { transition: transform .06s ease; }
  .sclera, .brow rect, .mouth rect { fill: #3cf; }
  .pupil circle { fill: #000; }

  .happy .eye        { transform: scaleY(.6); }
  .happy .mouth      { transform: scaleX(1.4); }

  .sad .eye          { transform: scaleY(.8); }
  .sad #brow-l       { transform: rotate(15deg) translateY(20px); }
  .sad #brow-r       { transform: rotate(-15deg) translateY(20px); }
  .sad .mouth        { transform: scaleX(.6) translateY(30px); }

  .surprised .eye    { transform: scale(1.15, 1.3); }
  .surprised .brow   { transform: translateY(-40px); }
  .surprised .mouth  { transform: scale(.4, 3); }

  .angry .eye        { transform: scaleY(.7); }
  .angry #brow-l     { transform: rotate(-20deg) translateY(30px); }
  .angry #brow-r     { transform: rotate(20deg) translateY(30px); }
  .angry .mouth      { transform: scaleX(.8) translateY(20px); }

  .sleepy .eye       { transform: scaleY(.25); }
  .sleepy .brow      { transform: translateY(30px); }
  .sleepy .mouth     { transform: scaleX(.5); }

  /* --- diagnostics --- */
  #diag-layer {
    position: fixed; inset: 0; background: #14171c; color: #e8ebef;
    font-family: system-ui, sans-serif; padding: 28px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 20px;
  }
  #diag-layer[hidden] { display: none; }
  .diag-toolbar { display: flex; align-items: center; gap: 16px; }
  .diag-heading { flex: 1; min-width: 0; }
  .diag-header { margin: 0; font-size: 25.2px; font-weight: 600; letter-spacing: -.5px; }
  .diag-hint { margin: 4px 0 0; font-size: 12.6px; color: #9ba5b3; }
  .nav-button { min-height: 44px; padding: 10px 16px; border: 1px solid #3c4552;
    border-radius: 8px; background: #242a33; color: #e8ebef;
    font: 500 14.4px system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
  .nav-button:hover { background: #303844; }
  .nav-button:active { background: #3c4756; }
  .nav-button:focus-visible, .diag-row summary:focus-visible {
    outline: 2px solid #9bbcf4; outline-offset: 3px;
  }
  #diag-map-btn { background: #a9c5ef; border-color: #a9c5ef; color: #182437; }
  #diag-map-btn:hover { background: #c1d6f5; }
  #diag-map-btn:active { background: #8eadde; }
  #diag-list { flex: 1; min-height: 0; overflow-y: auto; font-size: 16.2px; padding: 4px;
    scrollbar-color: #485260 transparent; }
  .diag-row { margin-bottom: 8px; border: 1px solid #303741; border-radius: 10px;
    background: #1d222a; overflow: hidden; }
  .diag-row summary { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 12px;
    align-items: center; gap: 12px; min-height: 48px; padding: 12px 16px;
    cursor: pointer; list-style: none; touch-action: manipulation; }
  .diag-row summary::-webkit-details-marker { display: none; }
  .diag-row summary:hover { background: #252c36; }
  .diag-row summary::after { content: ''; width: 6px; height: 6px;
    border-right: 1.5px solid #9ba5b3; border-bottom: 1.5px solid #9ba5b3;
    transform: rotate(-45deg); }
  .diag-row[open] summary::after { transform: rotate(45deg); }
  .diag-name { display: block; font-weight: 550; overflow-wrap: anywhere; }
  .diag-msg { display: block; margin-top: 3px; color: #acb5c2; font-size: 16.2px;
    overflow-wrap: anywhere; }
  .diag-dot { width: 8px; height: 8px; border-radius: 50%; background: #929dab; }
  .diag-level { font-size: 12.6px; color: #acb5c2; }
  .level-0 .diag-dot { background: #7dcba4; }
  .level-0 .diag-level { color: #7dcba4; }
  .level-1 .diag-dot { background: #e4bd72; }
  .level-1 .diag-level { color: #e4bd72; }
  .level-2 .diag-dot { background: #ef9292; }
  .level-2 .diag-level { color: #ef9292; }
  .diag-body { padding: 14px 16px 16px 36px; border-top: 1px solid #303741;
    font-size: 12.6px; color: #acb5c2; overflow-wrap: anywhere; }
  .diag-hw { margin-bottom: 10px; }
  .diag-kvs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
    gap: 8px 20px; margin: 0; }
  .diag-kvs dt { color: #9ba5b3; }
  .diag-kvs dd { margin: 0; color: #e8ebef; white-space: pre-wrap; }
  #diag-empty { padding: 60px 16px; text-align: center; font-size: 18px; color: #9ba5b3; }
  @media (max-width: 520px) {
    #diag-layer { padding: 16px; gap: 12px; }
    .diag-toolbar { flex-wrap: wrap; gap: 10px; }
    .diag-heading { order: -1; flex-basis: 100%; }
    #diag-map-btn { margin-left: auto; }
    .diag-row summary { padding: 12px; gap: 10px; }
    .diag-body { padding-left: 30px; }
  }

  /* --- map mode --- */
  #map-layer { position: fixed; inset: 0; background: #000; }
  #map-layer[hidden] { display: none; }
  #map-canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  #map-empty { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 20px; letter-spacing: 4px; opacity: .5;
    font-family: 'Courier New', ui-monospace, monospace; color: #4ff; }
  #map-empty[hidden] { display: none; }
  #map-back { position: absolute; top: 24px; left: 32px; z-index: 1; }
  #map-legend { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 20px; padding: 8px 12px; background: rgba(0,0,0,.8);
    font: 14px 'Courier New', ui-monospace, monospace; pointer-events: none; }
  #map-legend .robot { color: #f0f; }
  #map-legend .goal { color: #fc3; }
  #map-legend .path { color: #3f6; }
</style>

<div id="face-layer">
  <svg viewBox="0 0 1000 600" class="neutral">
    <g id="brow-l" class="brow"><rect x="150" y="110" width="200" height="30" rx="15"/></g>
    <g id="brow-r" class="brow"><rect x="650" y="110" width="200" height="30" rx="15"/></g>
    <g class="eye"><g class="lid">
      <rect class="sclera" x="150" y="170" width="200" height="220" rx="60"/>
      <g class="pupil"><circle cx="250" cy="280" r="40"/></g>
    </g></g>
    <g class="eye"><g class="lid">
      <rect class="sclera" x="650" y="170" width="200" height="220" rx="60"/>
      <g class="pupil"><circle cx="750" cy="280" r="40"/></g>
    </g></g>
    <g class="mouth"><g id="mouth-open"><rect x="350" y="470" width="300" height="30" rx="15"/></g></g>
  </svg>
</div>

<div id="diag-layer" hidden>
  <header class="diag-toolbar">
    <button id="diag-back" class="nav-button">&larr; Face</button>
    <div class="diag-heading">
      <h1 class="diag-header">Diagnostics</h1>
      <p class="diag-hint">Tap an entry to show or hide details</p>
    </div>
    <button id="diag-map-btn" class="nav-button">Map &rarr;</button>
  </header>
  <div id="diag-list"></div>
</div>

<div id="map-layer" hidden>
  <button id="map-back" class="nav-button">&larr; Diagnostics</button>
  <canvas id="map-canvas"></canvas>
  <div id="map-empty">NO MAP DATA</div>
  <div id="map-legend"><span class="robot">▲ ROBOT</span><span class="goal">⊕ GOAL</span><span class="path">━ PATH</span></div>
</div>

<script>
  const GAZE_SPEED = 3;         // gaze units per second; full sweep (-1..1) takes 2/GAZE_SPEED s
  const PUPIL_TRAVEL = 60;      // viewBox px the pupil moves at gaze = ±1
  const MOUTH_TIMEOUT_MS = 300; // no amplitude sample for this long -> mouth closes
  const MOUTH_MAX_SCALE = 4;    // mouth height multiplier at amplitude 1

  const svg = document.querySelector('svg');
  const pupils = document.querySelectorAll('.pupil');
  const lids = document.querySelectorAll('.lid');
  const mouthOpen = document.getElementById('mouth-open');
  const faceLayer = document.getElementById('face-layer');
  const diagLayer = document.getElementById('diag-layer');
  const diagList = document.getElementById('diag-list');
  const diagMapBtn = document.getElementById('diag-map-btn');
  const mapLayer = document.getElementById('map-layer');
  const mapBack = document.getElementById('map-back');
  const mapCanvas = document.getElementById('map-canvas');
  const mapEmpty = document.getElementById('map-empty');
  const mapCtx = mapCanvas.getContext('2d');

  let gaze = [0, 0], gazeTarget = [0, 0];
  let mouth = 0, mouthTarget = 0, mouthAt = 0;
  let diagnostics = [];
  let diagRenderTimer = null;
  const diagRows = new Map();
  const DIAG_RENDER_INTERVAL_MS = 300; // caps rendering work for frequent diagnostics updates

  function scheduleDiagRender() {
    if (diagLayer.hidden || diagRenderTimer) return;
    diagRenderTimer = setTimeout(() => { diagRenderTimer = null; renderDiagnostics(); }, DIAG_RENDER_INTERVAL_MS);
  }

  function diagnosticElement(tag, className, text) {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    return element;
  }

  function renderDiagnostics() {
    if (!diagnostics.length) {
      diagList.innerHTML = '<div id="diag-empty">No diagnostics data yet</div>';
      diagRows.clear();
      return;
    }
    document.getElementById('diag-empty')?.remove();
    const names = new Set(diagnostics.map(s => s.name));
    for (const [name, row] of diagRows) {
      if (!names.has(name)) { row.remove(); diagRows.delete(name); }
    }
    diagnostics.forEach((s, index) => {
      let row = diagRows.get(s.name);
      if (!row) {
        // Keep these nodes across updates so tapping, focus, and open state survive.
        row = document.createElement('details');
        const summary = document.createElement('summary');
        const text = document.createElement('span');
        text.append(diagnosticElement('span', 'diag-name', ''),
                    diagnosticElement('span', 'diag-msg', ''));
        const dot = diagnosticElement('span', 'diag-dot', '');
        dot.setAttribute('aria-hidden', 'true');
        summary.append(dot, text, diagnosticElement('span', 'diag-level', ''));
        row.append(summary, diagnosticElement('div', 'diag-body', ''));
        diagRows.set(s.name, row);
      }
      row.className = `diag-row level-${s.level}`;
      row.querySelector('.diag-name').textContent = s.name;
      row.querySelector('.diag-msg').textContent = s.message;
      row.querySelector('.diag-level').textContent = ['OK', 'Warning', 'Error', 'Stale'][s.level] || 'Unknown';
      const body = row.querySelector('.diag-body');
      const content = [];
      if (s.hardware_id) content.push(diagnosticElement('div', 'diag-hw', `Hardware: ${s.hardware_id}`));
      if (s.values.length) {
        const values = diagnosticElement('dl', 'diag-kvs', '');
        s.values.forEach(([k, v]) => values.append(
          diagnosticElement('dt', '', k), diagnosticElement('dd', '', v)));
        content.push(values);
      }
      if (!content.length) content.push(diagnosticElement('div', '', 'No additional details'));
      body.replaceChildren(...content);
      if (diagList.children[index] !== row) diagList.insertBefore(row, diagList.children[index] || null);
    });
  }

  let mapInfo = null;    // {resolution, width, height, origin} of the last-rendered map
  let mapBitmap = null;  // offscreen canvas holding the pre-rendered grid
  let mapDraw = null;    // {scale, offsetX, offsetY}: map-pixel <-> canvas-pixel
  let robotPose = null;  // [x, y, theta] in map-frame meters/radians
  let goalPosition = null; // [x, y] in map-frame meters
  let plannedPath = [];    // [[x, y], ...] in map-frame meters

  function renderMap(m) {
    mapInfo = { resolution: m.resolution, width: m.width, height: m.height, origin: m.origin };
    const raw = atob(m.data);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    const cells = new Int8Array(bytes.buffer);

    const off = document.createElement('canvas');
    off.width = m.width;
    off.height = m.height;
    const octx = off.getContext('2d');
    const img = octx.createImageData(m.width, m.height);
    for (let row = 0; row < m.height; row++) {
      for (let col = 0; col < m.width; col++) {
        const cell = cells[row * m.width + col];
        const di = ((m.height - 1 - row) * m.width + col) * 4; // flip: row 0 is the map's bottom
        let v;
        if (cell < 0) v = [40, 40, 40];        // unknown -> dark gray
        else if (cell < 50) v = [10, 10, 10];  // free -> near-black
        else v = [60, 255, 255];               // occupied -> cyan
        img.data[di] = v[0]; img.data[di + 1] = v[1]; img.data[di + 2] = v[2]; img.data[di + 3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    mapBitmap = off;
    mapEmpty.hidden = true;
    if (!mapLayer.hidden) drawMap();
  }

  // ponytail: assumes the map origin has zero yaw (true for virtually all SLAM-generated
  // maps). A rotated origin would need a rotation term here; add if a map ever has one.
  function mapToCanvas(x, y) {
    const col = (x - mapInfo.origin[0]) / mapInfo.resolution;
    const row = (y - mapInfo.origin[1]) / mapInfo.resolution;
    return [mapDraw.offsetX + col * mapDraw.scale,
            mapDraw.offsetY + (mapInfo.height - row) * mapDraw.scale];
  }

  function canvasToMap(px, py) {
    const col = (px - mapDraw.offsetX) / mapDraw.scale;
    const row = mapInfo.height - (py - mapDraw.offsetY) / mapDraw.scale;
    return [mapInfo.origin[0] + col * mapInfo.resolution, mapInfo.origin[1] + row * mapInfo.resolution];
  }

  function drawMap() {
    if (!mapBitmap) return;
    mapCanvas.width = window.innerWidth;
    mapCanvas.height = window.innerHeight;
    const scale = Math.min(mapCanvas.width / mapBitmap.width, mapCanvas.height / mapBitmap.height);
    const offsetX = (mapCanvas.width - mapBitmap.width * scale) / 2;
    const offsetY = (mapCanvas.height - mapBitmap.height * scale) / 2;
    mapDraw = { scale, offsetX, offsetY };
    mapCtx.imageSmoothingEnabled = false;
    mapCtx.fillStyle = '#000';
    mapCtx.fillRect(0, 0, mapCanvas.width, mapCanvas.height);
    mapCtx.drawImage(mapBitmap, offsetX, offsetY, mapBitmap.width * scale, mapBitmap.height * scale);
    drawPath();
    drawGoal();
    drawRobot();
  }

  function drawPath() {
    if (!plannedPath.length) return;
    mapCtx.save();
    mapCtx.strokeStyle = '#3f6';
    mapCtx.lineWidth = 3;
    mapCtx.lineJoin = 'round';
    mapCtx.lineCap = 'round';
    mapCtx.beginPath();
    plannedPath.forEach(([x, y], i) => {
      const [px, py] = mapToCanvas(x, y);
      if (i === 0) mapCtx.moveTo(px, py);
      else mapCtx.lineTo(px, py);
    });
    mapCtx.stroke();
    mapCtx.restore();
  }

  function drawGoal() {
    if (!goalPosition) return;
    const [px, py] = mapToCanvas(...goalPosition);
    mapCtx.save();
    mapCtx.strokeStyle = '#fc3';
    mapCtx.lineWidth = 3;
    mapCtx.beginPath();
    mapCtx.arc(px, py, 10, 0, Math.PI * 2);
    mapCtx.moveTo(px - 16, py); mapCtx.lineTo(px + 16, py);
    mapCtx.moveTo(px, py - 16); mapCtx.lineTo(px, py + 16);
    mapCtx.stroke();
    mapCtx.restore();
  }

  function drawRobot() {
    if (!robotPose || !mapDraw || !mapInfo) return;
    const [px, py] = mapToCanvas(robotPose[0], robotPose[1]);
    mapCtx.save();
    mapCtx.translate(px, py);
    mapCtx.rotate(-robotPose[2]);
    mapCtx.fillStyle = '#f0f';
    mapCtx.shadowColor = '#f0f';
    mapCtx.shadowBlur = 12;
    mapCtx.beginPath();
    mapCtx.moveTo(14, 0);
    mapCtx.lineTo(-10, 8);
    mapCtx.lineTo(-10, -8);
    mapCtx.closePath();
    mapCtx.fill();
    mapCtx.restore();
  }

  mapCanvas.addEventListener('click', (e) => {
    if (!mapInfo || !mapDraw) return;
    const rect = mapCanvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) * mapCanvas.width / rect.width;
    const py = (e.clientY - rect.top) * mapCanvas.height / rect.height;
    if (px < mapDraw.offsetX || py < mapDraw.offsetY ||
        px >= mapDraw.offsetX + mapInfo.width * mapDraw.scale ||
        py >= mapDraw.offsetY + mapInfo.height * mapDraw.scale) return;
    const [x, y] = canvasToMap(px, py);
    fetch('/goal', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ x, y }) });
  });

  window.addEventListener('resize', () => {
    if (!mapLayer.hidden) drawMap();
  });

  diagMapBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    diagLayer.hidden = true;
    mapLayer.hidden = false;
    mapEmpty.hidden = !!mapBitmap;
    if (mapBitmap) drawMap();
  });
  mapBack.addEventListener('click', (e) => {
    e.stopPropagation();
    mapLayer.hidden = true;
    diagLayer.hidden = false;
    renderDiagnostics();
  });

  faceLayer.addEventListener('click', () => {
    faceLayer.hidden = true;
    diagLayer.hidden = false;
    renderDiagnostics();
  });
  document.getElementById('diag-back').addEventListener('click', (e) => {
    e.stopPropagation();
    diagLayer.hidden = true;
    faceLayer.hidden = false;
  });

  const es = new EventSource('/events');
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.expression) svg.setAttribute('class', m.expression);
    if (m.gaze) gazeTarget = m.gaze;
    if (m.mouth !== undefined) { mouthTarget = m.mouth; mouthAt = performance.now(); }
    if (m.diagnostics) { diagnostics = m.diagnostics; scheduleDiagRender(); }
    if (m.map) renderMap(m.map);
    if (m.pose) { robotPose = m.pose; if (!mapLayer.hidden) drawMap(); }
    if (m.goal !== undefined) { goalPosition = m.goal; if (!mapLayer.hidden) drawMap(); }
    if (m.path !== undefined) { plannedPath = m.path; if (!mapLayer.hidden) drawMap(); }
  };

  let last = performance.now();
  function frame(now) {
    const dt = (now - last) / 1000;
    last = now;

    const step = GAZE_SPEED * dt;
    for (let i = 0; i < 2; i++) {
      const d = gazeTarget[i] - gaze[i];
      gaze[i] += Math.abs(d) <= step ? d : Math.sign(d) * step;
    }
    const tx = gaze[0] * PUPIL_TRAVEL, ty = -gaze[1] * PUPIL_TRAVEL; // +y is up
    pupils.forEach(p => p.style.transform = `translate(${tx}px, ${ty}px)`);

    if (now - mouthAt > MOUTH_TIMEOUT_MS) mouthTarget = 0;
    mouth += (mouthTarget - mouth) * Math.min(1, dt * 20);
    mouthOpen.style.transform = `scaleY(${1 + (MOUTH_MAX_SCALE - 1) * mouth})`;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function blink() {
    if (!svg.classList.contains('sleepy')) {
      lids.forEach(l => l.style.transform = 'scaleY(0.05)');
      setTimeout(() => lids.forEach(l => l.style.transform = ''), 120);
    }
    setTimeout(blink, 3000 + Math.random() * 4000);
  }
  blink();
</script>
