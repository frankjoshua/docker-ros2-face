<!doctype html>
<meta charset="utf-8">
<title>face</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  svg { width: 100vw; height: 100vh; display: block; }
  g { transform-box: fill-box; transform-origin: center; }
  .eye, .brow, .mouth { transition: transform .2s ease; }
  .lid { transition: transform .06s ease; }
  .sclera, .brow rect, .mouth rect { fill: #3cf; }
  .pupil circle { fill: #000; }

  .happy .eye        { transform: scaleY(.6); }
  .happy .mouth      { transform: scaleX(1.4); }

  .sad .eye          { transform: scaleY(.8); }
  .sad #brow-l       { transform: rotate(15deg) translateY(20px); }
  .sad #brow-r       { transform: rotate(-15deg) translateY(20px); }
  .sad .mouth        { transform: scaleX(.6) translateY(30px); }

  .surprised .eye    { transform: scale(1.15, 1.3); }
  .surprised .brow   { transform: translateY(-40px); }
  .surprised .mouth  { transform: scale(.4, 3); }

  .angry .eye        { transform: scaleY(.7); }
  .angry #brow-l     { transform: rotate(-20deg) translateY(30px); }
  .angry #brow-r     { transform: rotate(20deg) translateY(30px); }
  .angry .mouth      { transform: scaleX(.8) translateY(20px); }

  .sleepy .eye       { transform: scaleY(.25); }
  .sleepy .brow      { transform: translateY(30px); }
  .sleepy .mouth     { transform: scaleX(.5); }

  /* --- diagnostics HUD --- */
  #diag-layer {
    position: fixed; inset: 0; background: #000;
    font-family: 'Courier New', ui-monospace, monospace;
    color: #4ff; text-shadow: 0 0 6px rgba(68,255,255,.6);
  }
  #diag-layer[hidden] { display: none; }
  .diag-corner { position: absolute; width: 44px; height: 44px; border: 3px solid #4ff;
    box-shadow: 0 0 8px rgba(68,255,255,.6); opacity: .8; }
  .diag-corner.tl { top: 16px; left: 16px; border-right: none; border-bottom: none; }
  .diag-corner.tr { top: 16px; right: 16px; border-left: none; border-bottom: none; }
  .diag-corner.bl { bottom: 16px; left: 16px; border-right: none; border-top: none; }
  .diag-corner.br { bottom: 16px; right: 16px; border-left: none; border-top: none; }
  .diag-scanline { position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #4ff, transparent);
    opacity: .5; mix-blend-mode: screen; animation: scan 4s linear infinite; }
  @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
  .diag-header { position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
    font-size: 28px; letter-spacing: 8px; }
  #diag-back { position: absolute; top: 24px; left: 32px; background: transparent;
    color: #4ff; border: 2px solid #4ff; font-family: inherit; font-size: 16px;
    padding: 8px 16px; letter-spacing: 2px; cursor: pointer; }
  #diag-back:active { background: rgba(68,255,255,.2); }
  #diag-list { position: absolute; top: 90px; bottom: 60px; left: 60px; right: 60px;
    overflow-y: auto; font-size: 18px; }
  .diag-row { border-top: 1px solid rgba(68,255,255,.25); padding: 10px 0; }
  .diag-row:first-child { border-top: none; }
  .diag-name { display: inline-block; min-width: 3em; }
  .diag-msg { opacity: .85; margin-left: 12px; }
  .diag-hw { opacity: .5; margin-left: 12px; font-size: 14px; }
  .diag-kvs { margin-left: 22px; opacity: .7; font-size: 14px; }
  .diag-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
    margin-right: 10px; vertical-align: middle; box-shadow: 0 0 6px currentColor; }
  .level-0 .diag-dot { background: #3f6; color: #3f6; }
  .level-1 .diag-dot { background: #fc3; color: #fc3; }
  .level-2 .diag-dot { background: #f33; color: #f33; }
  .level-3 .diag-dot { background: #888; color: #888; }
  #diag-empty { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 20px; letter-spacing: 4px; opacity: .5; }
</style>

<div id="face-layer">
  <svg viewBox="0 0 1000 600" class="neutral">
    <g id="brow-l" class="brow"><rect x="150" y="110" width="200" height="30" rx="15"/></g>
    <g id="brow-r" class="brow"><rect x="650" y="110" width="200" height="30" rx="15"/></g>
    <g class="eye"><g class="lid">
      <rect class="sclera" x="150" y="170" width="200" height="220" rx="60"/>
      <g class="pupil"><circle cx="250" cy="280" r="40"/></g>
    </g></g>
    <g class="eye"><g class="lid">
      <rect class="sclera" x="650" y="170" width="200" height="220" rx="60"/>
      <g class="pupil"><circle cx="750" cy="280" r="40"/></g>
    </g></g>
    <g class="mouth"><g id="mouth-open"><rect x="350" y="470" width="300" height="30" rx="15"/></g></g>
  </svg>
</div>

<div id="diag-layer" hidden>
  <div class="diag-corner tl"></div>
  <div class="diag-corner tr"></div>
  <div class="diag-corner bl"></div>
  <div class="diag-corner br"></div>
  <div class="diag-scanline"></div>
  <div class="diag-header">DIAGNOSTICS</div>
  <button id="diag-back">&larr; BACK</button>
  <div id="diag-list"></div>
</div>

<script>
  const GAZE_SPEED = 3;         // gaze units per second; full sweep (-1..1) takes 2/GAZE_SPEED s
  const PUPIL_TRAVEL = 60;      // viewBox px the pupil moves at gaze = ±1
  const MOUTH_TIMEOUT_MS = 300; // no amplitude sample for this long -> mouth closes
  const MOUTH_MAX_SCALE = 4;    // mouth height multiplier at amplitude 1

  const svg = document.querySelector('svg');
  const pupils = document.querySelectorAll('.pupil');
  const lids = document.querySelectorAll('.lid');
  const mouthOpen = document.getElementById('mouth-open');
  const faceLayer = document.getElementById('face-layer');
  const diagLayer = document.getElementById('diag-layer');
  const diagList = document.getElementById('diag-list');

  let gaze = [0, 0], gazeTarget = [0, 0];
  let mouth = 0, mouthTarget = 0, mouthAt = 0;
  let diagnostics = [];
  let diagRenderTimer = null;
  const DIAG_RENDER_INTERVAL_MS = 300; // caps re-render rate so a fast /diagnostics publisher doesn't flicker the HUD

  function scheduleDiagRender() {
    if (diagLayer.hidden || diagRenderTimer) return;
    diagRenderTimer = setTimeout(() => { diagRenderTimer = null; renderDiagnostics(); }, DIAG_RENDER_INTERVAL_MS);
  }

  function renderDiagnostics() {
    if (!diagnostics.length) {
      diagList.innerHTML = '<div id="diag-empty">NO DIAGNOSTICS DATA</div>';
      return;
    }
    diagList.innerHTML = diagnostics.map(s => `
      <div class="diag-row level-${s.level}">
        <span class="diag-dot"></span>
        <span class="diag-name">${s.name}</span>
        <span class="diag-msg">${s.message}</span>
        ${s.hardware_id ? `<span class="diag-hw">[${s.hardware_id}]</span>` : ''}
        ${s.values.map(([k, v]) => `<div class="diag-kvs">${k}: ${v}</div>`).join('')}
      </div>`).join('');
  }

  faceLayer.addEventListener('click', () => {
    faceLayer.hidden = true;
    diagLayer.hidden = false;
    renderDiagnostics();
  });
  document.getElementById('diag-back').addEventListener('click', (e) => {
    e.stopPropagation();
    diagLayer.hidden = true;
    faceLayer.hidden = false;
  });

  const es = new EventSource('/events');
  es.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.expression) svg.setAttribute('class', m.expression);
    if (m.gaze) gazeTarget = m.gaze;
    if (m.mouth !== undefined) { mouthTarget = m.mouth; mouthAt = performance.now(); }
    if (m.diagnostics) { diagnostics = m.diagnostics; scheduleDiagRender(); }
  };

  let last = performance.now();
  function frame(now) {
    const dt = (now - last) / 1000;
    last = now;

    const step = GAZE_SPEED * dt;
    for (let i = 0; i < 2; i++) {
      const d = gazeTarget[i] - gaze[i];
      gaze[i] += Math.abs(d) <= step ? d : Math.sign(d) * step;
    }
    const tx = gaze[0] * PUPIL_TRAVEL, ty = -gaze[1] * PUPIL_TRAVEL; // +y is up
    pupils.forEach(p => p.style.transform = `translate(${tx}px, ${ty}px)`);

    if (now - mouthAt > MOUTH_TIMEOUT_MS) mouthTarget = 0;
    mouth += (mouthTarget - mouth) * Math.min(1, dt * 20);
    mouthOpen.style.transform = `scaleY(${1 + (MOUTH_MAX_SCALE - 1) * mouth})`;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function blink() {
    if (!svg.classList.contains('sleepy')) {
      lids.forEach(l => l.style.transform = 'scaleY(0.05)');
      setTimeout(() => lids.forEach(l => l.style.transform = ''), 120);
    }
    setTimeout(blink, 3000 + Math.random() * 4000);
  }
  blink();
</script>
